name: Keep Render Services Alive

# 北京时间 6:00 - 次日 1:00（UTC 22:00 前日 - UTC 17:00）
# 每 14 分钟 ping 一次
on:
  schedule:
    - cron: "0,14,28,42,56 22,23 * * *"  # UTC 22:00-23:56（北京 6:00-7:56）
    - cron: "0,14,28,42,56 0-16 * * *"   # UTC 0:00-16:56（北京 8:00-0:56）
    - cron: "0 17 * * *"                  # UTC 17:00（北京 1:00 最后一次）
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Python PDF Service
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            https://resume-pdf-service-6m2i.onrender.com/health)
          echo "PDF Service status: $STATUS"

      - name: Ping Next.js App
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            https://resume-editing.onrender.com)
          echo "Next.js App status: $STATUS"
